<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Market List Builder</title>
	<style>
		body { font-family: Arial, sans-serif; background: #f7fafc; margin: 0; padding: 20px; }
		main { max-width: 960px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
		h1 { margin-top: 0; }
		.controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
		.controls input { flex: 1; min-width: 180px; padding: 10px; border: 1px solid #cbd5f5; border-radius: 6px; }
		button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
		button.primary { background: #3182ce; color: #fff; }
		button.secondary { background: #e2e8f0; }
		button.danger { background: #e53e3e; color: #fff; }
		table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
		th, td { border: 1px solid #e2e8f0; padding: 8px; }
		th { background: #edf2f7; text-align: left; }
		td input { width: 100%; border: none; background: transparent; padding: 6px; }
		textarea { width: 100%; min-height: 160px; border: 1px solid #cbd5f5; border-radius: 6px; padding: 10px; font-family: monospace; }
		.actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
	</style>
</head>
<body>
	<main>
		<h1>Market List Builder</h1>
		<p>Create tabular data and push the JSON directly into the vehicle form.</p>
		<div class="controls">
			<input id="newColumnName" placeholder="New column name" />
			<button class="secondary" id="addColumnBtn">Add Column</button>
			<button class="secondary" id="addRowBtn">Add Row</button>
		</div>
		<div class="table-wrapper">
			<table>
				<thead id="builderHead"></thead>
				<tbody id="builderBody"></tbody>
			</table>
		</div>
		<label>Generated JSON<textarea id="jsonPreview" readonly></textarea></label>
		<div class="actions">
			<button class="secondary" id="refreshJsonBtn">Refresh Preview</button>
			<button class="primary" id="sendToDashboardBtn">Send to Dashboard</button>
			<button class="danger" id="clearBtn">Reset Builder</button>
			<button class="secondary" onclick="window.location.href='/'">Back to Dashboard</button>
		</div>
	</main>
	<script>
		const storageKey = 'generatedMarketList';
		const state = {
			columns: ['Item', 'Quantity', 'Destination'],
			rows: [ ['','',''] ],
		};

		const headEl = document.getElementById('builderHead');
		const bodyEl = document.getElementById('builderBody');
		const previewEl = document.getElementById('jsonPreview');

		const escapeHtml = (value) => value
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;')
			.replace(/"/g, '&quot;');

		const renderTable = () => {
			const headerCells = state.columns.map((col) => '<th>' + escapeHtml(col) + '</th>').join('');
			headEl.innerHTML = '<tr>' + headerCells + '<th></th></tr>';
			bodyEl.innerHTML = state.rows
				.map((row, rowIdx) => {
					const rowCells = row
						.map((cell, colIdx) => '<td><input value="' + escapeHtml(cell) + '" data-row="' + rowIdx + '" data-col="' + colIdx + '" /></td>')
						.join('');
					return '<tr>' + rowCells + '<td><button type="button" class="danger" data-remove-row="' + rowIdx + '">Remove</button></td></tr>';
				})
				.join('');
		};

		const ensureRowWidth = (row) => {
			while (row.length < state.columns.length) {
				row.push('');
			}
		};

		const addColumn = (name) => {
			if (!name.trim()) return;
			state.columns.push(name.trim());
			state.rows.forEach(ensureRowWidth);
			renderTable();
			updatePreview();
		};

		const addRow = () => {
			const row = new Array(state.columns.length).fill('');
			state.rows.push(row);
			renderTable();
		};

		const removeRow = (index) => {
			state.rows.splice(index, 1);
			if (!state.rows.length) {
				state.rows.push(new Array(state.columns.length).fill(''));
			}
			renderTable();
			updatePreview();
		};

		const updatePreview = () => {
			const payload = state.rows.map((row) => {
				const entry = {};
				state.columns.forEach((col, idx) => {
					entry[col] = row[idx] ?? '';
				});
				return entry;
			});
			previewEl.value = JSON.stringify(payload, null, 2);
			return previewEl.value;
		};

		document.getElementById('addColumnBtn').addEventListener('click', () => {
			const input = document.getElementById('newColumnName');
			if (input.value.trim()) {
				addColumn(input.value);
				input.value = '';
			}
		});

		document.getElementById('addRowBtn').addEventListener('click', addRow);

		bodyEl.addEventListener('input', (event) => {
			const target = event.target;
			if (target instanceof HTMLInputElement && target.dataset.row) {
				const rowIdx = Number(target.dataset.row);
				const colIdx = Number(target.dataset.col);
				state.rows[rowIdx][colIdx] = target.value;
				updatePreview();
			}
		});

		bodyEl.addEventListener('click', (event) => {
			const target = event.target;
			if (target instanceof HTMLButtonElement && target.dataset.removeRow) {
				removeRow(Number(target.dataset.removeRow));
			}
		});

		document.getElementById('refreshJsonBtn').addEventListener('click', updatePreview);

		document.getElementById('sendToDashboardBtn').addEventListener('click', () => {
			const json = updatePreview();
			localStorage.setItem(storageKey, json);
			window.location.href = '/';
		});

		document.getElementById('clearBtn').addEventListener('click', () => {
			state.columns = ['Item', 'Quantity', 'Destination'];
			state.rows = [ ['','',''] ];
			renderTable();
			updatePreview();
		});

		renderTable();
		updatePreview();
	</script>
</body>
</html>
